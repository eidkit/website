<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none" role="img" aria-label="EidKit">
  <!-- Card body -->
  <rect x="2" y="8" width="36" height="24" rx="3.5" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <!-- Card chip -->
  <rect x="8" y="16" width="8" height="6" rx="1" fill="#f5c842"/>
  <!-- Card chip lines -->
  <line x1="9.5" y1="16" x2="9.5" y2="22" stroke="#c9961a" stroke-width="0.6"/>
  <line x1="11.5" y1="16" x2="11.5" y2="22" stroke="#c9961a" stroke-width="0.6"/>
  <line x1="13.5" y1="16" x2="13.5" y2="22" stroke="#c9961a" stroke-width="0.6"/>
  <line x1="8" y1="17.5" x2="16" y2="17.5" stroke="#c9961a" stroke-width="0.6"/>
  <line x1="8" y1="20.5" x2="16" y2="20.5" stroke="#c9961a" stroke-width="0.6"/>
  <!-- NFC waves -->
  <path d="M20 17 Q22 20 20 23" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M23 15 Q26.5 20 23 25" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M26 13 Q31 20 26 27" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.45"/>
  <!-- Wordmark white -->
  <text x="46" y="27" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3" fill="white">Eid</text>
  <text x="78" y="27" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3" fill="rgba(255,255,255,0.65)">Kit</text>
</svg>
