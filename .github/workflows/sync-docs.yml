name: Sync API docs from SDK repos

# Triggers:
#   1. Manual via GitHub UI
#   2. Weekly (Monday 04:00 UTC) — catches any out-of-band publishes
#   3. repository_dispatch from SDK repos on tag push
#      SDK repos call: POST /repos/eidkit/eidkit-website/dispatches
#      with event_type: sdk-docs-published
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  repository_dispatch:
    types: [sdk-docs-published]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Android: fetch Dokka output from eidkit-android gh-pages ────────────
      - name: Fetch Android API docs
        run: |
          git clone --depth 1 --branch gh-pages \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/eidkit/eidkit-android.git \
            /tmp/android-docs || echo "No gh-pages branch yet — skipping Android docs"

          if [ -d /tmp/android-docs/android-api ]; then
            mkdir -p static/android-api
            rsync -a --delete /tmp/android-docs/android-api/ static/android-api/
            echo "Android docs synced"
          else
            echo "android-api/ not found in gh-pages — skipping"
          fi

      # ── iOS: fetch DocC output from eidkit-ios gh-pages ─────────────────────
      - name: Fetch iOS API docs
        run: |
          git clone --depth 1 --branch gh-pages \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/eidkit/eidkit-ios.git \
            /tmp/ios-docs || echo "No gh-pages branch yet — skipping iOS docs"

          if [ -d /tmp/ios-docs/ios-api ]; then
            mkdir -p static/ios-api
            rsync -a --delete /tmp/ios-docs/ios-api/ static/ios-api/
            echo "iOS docs synced"
          else
            echo "ios-api/ not found in gh-pages — skipping"
          fi

      # ── Commit and push (triggers deploy.yml) ───────────────────────────────
      - name: Commit updated docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/android-api static/ios-api
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync API docs from SDK repos"
            git push
          fi
